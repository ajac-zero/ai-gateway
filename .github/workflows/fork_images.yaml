name: Fork Images
# Fork-only: publishes the fork/main images to GHCR. Upstream's docker_build_job.yaml pushes to Docker Hub and is left untouched.
on:
  push:
    branches:
      - "fork/main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.command_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - command_name: controller
            cmd_path_prefix: cmd
          - command_name: extproc
            cmd_path_prefix: cmd
          - command_name: aigw
            cmd_path_prefix: cmd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.command_name }}
        run: |
          for TAG in "${{ github.sha }}" latest; do
            make docker-build.${{ matrix.command_name }} \
              CMD_PATH_PREFIX=${{ matrix.cmd_path_prefix }} \
              OCI_REGISTRY=ghcr.io/${{ github.repository_owner }} \
              ENABLE_MULTI_PLATFORMS=true TAG=$TAG DOCKER_BUILD_ARGS="--push"
          done
