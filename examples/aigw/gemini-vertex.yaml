# Standalone `aigw run` configuration for Gemini native API testing on Vertex AI.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aigw-run-gemini
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: aigw-run-gemini
  namespace: default
spec:
  gatewayClassName: aigw-run-gemini
  listeners:
    - name: http
      protocol: HTTP
      port: 1975
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIGatewayRoute
metadata:
  name: aigw-run-gemini
  namespace: default
spec:
  parentRefs:
    - name: aigw-run-gemini
      kind: Gateway
      group: gateway.networking.k8s.io
  llmRequestCosts:
    - metadataKey: llm_input_token
      type: InputToken
    - metadataKey: llm_output_token
      type: OutputToken
    - metadataKey: llm_total_token
      type: TotalToken
    - metadataKey: llm_cached_input_token
      type: CachedInputToken
    - metadataKey: llm_reasoning_token
      type: ReasoningToken
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-ai-eg-model
              value: ${GEMINI_MODEL:=gemini-3.6-flash}
      backendRefs:
        - name: gemini-vertex
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: AIServiceBackend
metadata:
  name: gemini-vertex
  namespace: default
spec:
  schema:
    name: GCPVertexAI
  backendRef:
    name: gemini-vertex
    kind: Backend
    group: gateway.envoyproxy.io
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: gemini-vertex
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: aiplatform.googleapis.com
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: gemini-vertex
  namespace: default
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: gemini-vertex
  validation:
    wellKnownCACertificates: System
    hostname: aiplatform.googleapis.com
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-vertex-service-account
  namespace: default
  annotations:
    substitution.aigw.run/file/service_account.json: ${GOOGLE_APPLICATION_CREDENTIALS:=$HOME/.secrets/service_account.json}
stringData:
  service_account.json: "{}"
---
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: BackendSecurityPolicy
metadata:
  name: gemini-vertex
  namespace: default
spec:
  targetRefs:
    - group: aigateway.envoyproxy.io
      kind: AIServiceBackend
      name: gemini-vertex
  type: GCPCredentials
  gcpCredentials:
    projectName: ${GOOGLE_CLOUD_PROJECT:=bnt-ia-innovacion}
    region: global
    credentialsFile:
      secretRef:
        name: gemini-vertex-service-account
